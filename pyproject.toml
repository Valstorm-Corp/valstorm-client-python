[project]
name = "valstorm-client @ git+https://github.com/Valstorm-Corp/valstorm-client-python.git"
version = "0.1.3"
description = "Official Python Client SDK for Open Valstorm (Async & Sync with 1:1 PlatformContext Parity)"
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
authors = [
    { name = "Valstorm Engineering", email = "engineering@valstorm.com" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/valstorm"]

[tool.hatch.build.targets.sdist]
include = [
    "src/valstorm/**/*.py",
    "src/valstorm/py.typed",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
    "bandit>=1.8.0",
    "pip-audit>=2.8.0",
    "pip-licenses>=5.0.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["valstorm"]

[tool.mypy]
python_version = "3.13"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
